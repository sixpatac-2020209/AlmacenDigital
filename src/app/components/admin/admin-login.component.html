<div class="login-container">
  <div class="login-card">
    <h1>Panel de Administrador</h1>
    <p class="subtitle">Acceso Privado - Gestionar Productos</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="admin@example.com"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password"
          type="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="Tu contraseña"
          required
          [disabled]="loading"
        />
      </div>

      <button 
        type="submit" 
        class="btn-login"
        [disabled]="loading"
      >
        {{ loading ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
    </form>
  </div>
</div>
