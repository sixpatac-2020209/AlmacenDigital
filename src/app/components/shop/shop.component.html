<!-- Page Header -->
<div class="container-fluid bg-secondary mb-5">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 150px">
        <h1 class="font-weight-semi-bold text-uppercase mb-3">Nuestra Tienda</h1>
        <div class="d-inline-flex">
            <p class="m-0"><a routerLink="/">Inicio</a></p>
            <p class="m-0 px-2">-</p>
            <p class="m-0">Tienda</p>
        </div>
    </div>
</div>

<!-- Shop -->
<div class="container-fluid pt-5">
    <div class="row px-xl-5">

        <!-- SIDEBAR -->
        <div class="col-lg-3 col-md-12">

            <!-- CATEGORÍAS -->
            <div class="border-bottom mb-4 pb-4">
                <h5 class="font-weight-semi-bold mb-4">Categorías</h5>

                <!-- Todas -->
                <div class="custom-control custom-radio mb-2">
                    <input type="radio" class="custom-control-input" name="categoria" id="cat-all"
                        (change)="categoriaSeleccionada = null; filtrarProductos()" checked>
                    <label class="custom-control-label" for="cat-all">
                        Todas
                    </label>
                </div>

                <!-- Dinámicas -->
                <div class="custom-control custom-radio mb-2" *ngFor="let cat of categorias">
                    <input type="radio" class="custom-control-input" name="categoria" [value]="cat.id"
                        (change)="categoriaSeleccionada = +cat.id; filtrarProductos()" [id]="'cat-' + cat.id">
                    <label class="custom-control-label" [for]="'cat-' + cat.id">
                        {{ cat.nombre }}
                    </label>
                </div>
            </div>

        </div>

        <!-- PRODUCTOS -->
        <div class="col-lg-9 col-md-12">

            <!-- BUSCADOR -->
            <div class="row pb-3">
                <div class="col-12 pb-1">
                    <div class="d-flex align-items-center justify-content-between mb-4">

                        <form (ngSubmit)="filtrarProductos()">
                            <div class="input-group">
                                <input type="text" class="form-control" name="busqueda" placeholder="Buscar producto..."
                                    [(ngModel)]="busqueda">
                                <div class="input-group-append">
                                    <span class="input-group-text bg-transparent text-primary">
                                        <i class="fa fa-search"></i>
                                    </span>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTRO DE PRECIOS -->
                <div class="col-12 pb-3">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="font-weight-semi-bold mb-2">Precio mínimo</label>
                            <input type="number" class="form-control" [(ngModel)]="precioMin" (input)="filtrarProductos()" placeholder="0">
                        </div>
                        <div class="col-md-6">
                            <label class="font-weight-semi-bold mb-2">Precio máximo</label>
                            <input type="number" class="form-control" [(ngModel)]="precioMax" (input)="filtrarProductos()" placeholder="999999">
                        </div>
                    </div>
                </div>

                <!-- LISTADO -->
                <div class="col-12 mb-4" *ngIf="loading">
                    <div class="alert alert-info mb-0" role="alert">
                        <i class="fa fa-spinner fa-spin mr-2"></i>Cargando productos...
                    </div>
                </div>
                <div class="col-12 mb-4" *ngIf="!loading && productosFiltrados.length === 0">
                    <div class="alert alert-info mb-0" role="alert">
                        No se encontraron productos con ese criterio de búsqueda.
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 col-sm-12 pb-1" *ngFor="let product of productosFiltrados">

                    <div class="card product-item border-0 mb-4" style="height: 325px; display: flex; flex-direction: column; justify-content: space-between;">

                        <div
                            class="card-header product-img position-relative overflow-hidden bg-transparent border p-0"
                            style="height: 170px;">
                            <img class="img-fluid w-100" [src]="product.imagen" alt="" style="height: 100%; object-fit: cover;">
                        </div>

                        <div class="card-body border-left border-right text-center p-0 pt-4 pb-3">
                            <h6 class="text-truncate mb-3">{{ product.nombre }}</h6>

                            <div class="d-flex justify-content-center">
                                <h6 *ngIf="product.oferta == 1 && product.precioOferta && product.precioOferta < product.precio" class="text-primary font-weight-bold">Q.{{ product.precioOferta | number:'1.2-2' }}</h6>
                                <h6 *ngIf="!product.oferta || !product.precioOferta || product.precioOferta >= product.precio" class="text-primary font-weight-bold">Q.{{ product.precio | number:'1.2-2' }}</h6>

                                <h6 class="text-muted ml-2" *ngIf="product.oferta == 1 && product.precioOferta && product.precioOferta < product.precio">
                                    <del>Q.{{ product.precio | number:'1.2-2' }}</del>
                                </h6>
                            </div>
                        </div>

                        <div class="card-footer d-flex justify-content-between bg-light border">
                            <a [routerLink]="['/detail', product.id]" class="btn btn-sm text-dark p-0">
                                <i class="fas fa-eye text-primary mr-1"></i>Ver detalle
                            </a>

                            <button class="btn btn-sm text-dark p-0" (click)="addToCart(product)">
                                <i class="fas fa-shopping-cart text-primary mr-1"></i>
                                Agregar
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
