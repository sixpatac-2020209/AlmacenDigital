<!-- Page Header Start -->
<div class="container-fluid bg-secondary mb-5">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 150px">
        <h1 class="font-weight-semi-bold text-uppercase mb-3">Pago</h1>
        <div class="d-inline-flex">
            <p class="m-0"><a routerLink="/">Inicio</a></p>
            <p class="m-0 px-2">-</p>
            <p class="m-0">Pago</p>
        </div>
    </div>
</div>
<!-- Page Header End -->

<div class="container-fluid pt-5 pb-5">
    <div class="row px-xl-5">
        <div class="col-lg-8">
            <div style="background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; margin-bottom: 25px;">
                <div style="display: flex; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #007bff;">
                    <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 15px;">1</div>
                    <h4 style="color: #2d3436; font-weight: 700; margin: 0;">Datos de facturación</h4>
                </div>
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label style="color: #6c757d; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Nombre *</label>
                        <input class="form-control" [(ngModel)]="facturacion.nombre" name="f_nombre" placeholder="Tu nombre completo" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-6 form-group">
                        <label style="color: #6c757d; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Apellido *</label>
                        <input class="form-control" [(ngModel)]="facturacion.apellido" name="f_apellido" placeholder="Tu apellido" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-6 form-group">
                        <label style="color: #6c757d; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Correo electrónico *</label>
                        <input class="form-control" type="email" [(ngModel)]="facturacion.email" name="f_email" placeholder="correo@ejemplo.com" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-6 form-group">
                        <label style="color: #6c757d; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Teléfono *</label>
                        <input class="form-control" [(ngModel)]="facturacion.telefono" name="f_telefono" placeholder="+502 1234-5678" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-12 form-group">
                        <label style="color: #6c757d; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Dirección *</label>
                        <input class="form-control" [(ngModel)]="facturacion.direccion" name="f_direccion" placeholder="Calle, ciudad, país" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                </div>
            </div>
            <div style="display: flex; align-items: center; margin-bottom: 25px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #28a745;">
                <input type="checkbox" style="margin-right: 12px; width: 20px; height: 20px; cursor: pointer;" [(ngModel)]="usarMismosDatos" id="usarDatos">
                <label style="margin: 0; cursor: pointer; color: #495057; font-weight: 500;" for="usarDatos">
                    <i class="fa fa-check-circle" style="color: #28a745; margin-right: 8px;"></i>Usar los mismos datos para envío
                </label>
            </div>
            <div *ngIf="!usarMismosDatos" style="background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px;">
                <div style="display: flex; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #007bff;">
                    <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 15px;">2</div>
                    <h4 style="color: #2d3436; font-weight: 700; margin: 0;">Datos de envío</h4>
                </div>
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label style="color: #6c757d; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Nombre</label>
                        <input class="form-control" [(ngModel)]="envio.nombre" name="e_nombre" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-6 form-group">
                        <input class="form-control" [(ngModel)]="envio.apellido" name="e_apellido" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-6 form-group">
                        <input class="form-control" type="email" [(ngModel)]="envio.email" name="e_email" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-6 form-group">
                        <input class="form-control" [(ngModel)]="envio.telefono" name="e_telefono" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                    <div class="col-md-12 form-group">
                        <input class="form-control" [(ngModel)]="envio.direccion" name="e_direccion" style="border-radius: 8px; border: 1px solid #dee2e6; padding: 12px;">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div style="background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; border-left: 4px solid #007bff;" class="mb-4">
                <div style="background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; padding: 20px; font-weight: 700; font-size: 18px;">
                    <i class="fa fa-box mr-2"></i>Resumen
                </div>
                <div style="padding: 25px;">
                    <div *ngFor="let item of carrito" class="d-flex justify-content-between mb-3" style="align-items: center; border-bottom: 1px solid #e9ecef; padding-bottom: 12px;">
                        <div style="flex: 1;">
                            <small style="color: #6c757d; font-weight: 600;">{{ item.nombre }}</small>
                            <div style="color: #007bff; font-weight: 700; font-size: 14px;">x{{ item.cantidad }}</div>
                        </div>
                        <div style="color: #2d3436; font-weight: 700;">Q.{{ (item.precio * item.cantidad) | number:'1.2-2' }}</div>
                    </div>
                    <div class="d-flex justify-content-between" style="padding: 15px 0; border-bottom: 1px solid #e9ecef; margin-bottom: 15px;">
                        <span style="color: #495057; font-weight: 600;">Envío</span>
                        <span style="color: #28a745; font-weight: 700;">Q.{{ getShippingCost() | number:'1.2-2' }}</span>
                    </div>
                    <div class="d-flex justify-content-between" style="padding: 15px 0; border-top: 2px solid #007bff;">
                        <span style="color: #2d3436; font-weight: 700; font-size: 16px;">Total</span>
                        <span style="color: #007bff; font-weight: 700; font-size: 20px;">Q.{{ getGrandTotal() | number:'1.2-2' }}</span>
                    </div>
                </div>
                <div style="padding: 20px; background: #f8f9fa; border-top: 1px solid #e9ecef;">
                    <button (click)="enviarPedido()" class="btn btn-primary btn-block py-3" style="font-weight: 600; border-radius: 8px;">
                        <i class="fa fa-lock mr-2"></i>Realizar pedido
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
